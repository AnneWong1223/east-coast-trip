<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 東海岸 4 天 3 夜家族自駕遊</title>
  <!-- 引入業界最穩定的 CSV 解析套件 PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #e11d48;
      --tag-bg: #f1f5f9;
      --border: #e2e8f0;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 20px 10px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border-radius: 16px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }
    header h1 { font-size: 1.5rem; margin-bottom: 6px; }
    header p { font-size: 0.9rem; opacity: 0.95; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .sync-text { font-size: 0.82rem; color: var(--text-muted); }
    .btn-sync {
      background: var(--primary);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .btn-sync:hover { background: var(--primary-dark); }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      flex: 1;
      min-width: 70px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .day-section { margin-bottom: 24px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .day-badge {
      background: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .day-date {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .item-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .item-time {
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .item-title {
      font-size: 1.08rem;
      font-weight: bold;
      color: var(--text-main);
      margin: 4px 0 8px 0;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .tag.cost {
      background: #fef2f2;
      color: var(--accent);
      font-weight: 600;
    }
    .item-detail {
      font-size: 0.88rem;
      color: #334155;
      background: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
      margin-top: 6px;
    }
    .item-detail-row { margin-bottom: 4px; }
    .item-detail-row:last-child { margin-bottom: 0; }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🚗 東海岸 4 天 3 夜家族自駕遊</h1>
      <p>台東 ➔ 鹿野 ➔ 鸞山 ➔ 長濱 ➔ 赤科山 ➔ 大農大富 ➔ 花蓮</p>
    </header>

    <div class="status-bar">
      <span class="sync-text" id="sync-status">⏳ 正在連線 Google 試算表...</span>
      <button class="btn-sync" onclick="fetchLiveData()">🔄 即時同步</button>
    </div>

    <!-- 頁籤按鈕 -->
    <div class="tabs" id="tab-container">
      <button class="tab-btn active" onclick="filterDay('ALL')">全部行程</button>
      <button class="tab-btn" onclick="filterDay('Day 1')">Day 1</button>
      <button class="tab-btn" onclick="filterDay('Day 2')">Day 2</button>
      <button class="tab-btn" onclick="filterDay('Day 3')">Day 3</button>
      <button class="tab-btn" onclick="filterDay('Day 4')">Day 4</button>
    </div>

    <!-- 內容呈現區 -->
    <div id="content-container"></div>
  </div>

  <script>
    // 🔗 您的 Google 試算表公開 CSV 網址
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQAY8BCfsJ2o8uJ40Rtr02qoKp9Yf2OKLdRROT_XVJH5mlG7EV-itdKxAxVwyBAbA/pub?output=csv";

    // 💡 內建離線完整資料庫（保證秒開、永不留白）
    const DEFAULT_DATA = [
      {"day": "Day 1", "date": "9/25 (五)", "time": "07:20-11:10", "title": "台北搭乘 EMU3000 直達台東車站", "route": "台鐵直達（408 車次）", "driveTime": "-", "stayTime": "-", "cost": "$783 ~ $936", "remark": "8/25 00:00 準時開搶 9/25, 9/28 車票"},
      {"day": "Day 1", "date": "9/25 (五)", "time": "11:30-13:30", "title": "台東車站取車 ＋ 市區享用在地午餐", "route": "站前取車，大行李放後備箱", "driveTime": "-", "stayTime": "1.5~2小時", "cost": "$250 ~ $350", "remark": "租車 4 天（台東租、花蓮還）"},
      {"day": "Day 1", "date": "9/25 (五)", "time": "13:30-17:30", "title": "台 9 線慢遊順遊（美濃冰品／鹿野神社／高台）", "route": "台東車站 -> 台9線 -> 鹿野", "driveTime": "約 45 分鐘", "stayTime": "3~3.5小時", "cost": "$100 ~ $200", "remark": "美濃冰品、鹿野神社、鹿野高台等"},
      {"day": "Day 1", "date": "9/25 (五)", "time": "18:00", "title": "入住鹿野縱谷民宿 (Night 1)，享用特色晚餐", "route": "鹿野市區周邊", "driveTime": "-", "stayTime": "-", "cost": "$750 ~ $1,250/人", "remark": "住鹿野為隔天鸞山省去早起趕路壓力"},
      {"day": "Day 2", "date": "9/26 (六)", "time": "08:00-08:40", "title": "民宿早餐退房，出發前往鸞山派出所集合", "route": "鹿野 -> 鸞山派出所", "driveTime": "約 25 分鐘", "stayTime": "-", "cost": "$80 ~ $100", "remark": "全團需備米酒1瓶+檳榔1包"},
      {"day": "Day 2", "date": "9/26 (六)", "time": "08:50-13:30", "title": "鸞山森林博物館體驗（爬巨木＋柴燒風味午餐）", "route": "部落專人導覽與活動體驗", "driveTime": "-", "stayTime": "4.5小時", "cost": "$600 (門票體驗)", "remark": "務必提前預約；穿防滑好走球鞋"},
      {"day": "Day 2", "date": "9/26 (六)", "time": "14:00-17:00", "title": "鸞山切回台 11 線海岸，順遊三仙台／石雨傘", "route": "鸞山 -> 台11線 -> 長濱", "driveTime": "約 1.5 小時", "stayTime": "1.5~2小時", "cost": "$100 ~ $200", "remark": "順遊小野柳、杉原灣或三仙台"},
      {"day": "Day 2", "date": "9/26 (六)", "time": "17:30", "title": "入住長濱海景民宿 (Night 2)，享用海鮮大餐", "route": "長濱海邊民宿", "driveTime": "10 分鐘", "stayTime": "-", "cost": "$1,400 ~ $2,100/人", "remark": "晚上看太平洋星空、中秋賞月"},
      {"day": "Day 3", "date": "9/27 (日)", "time": "08:30-10:00", "title": "漫步金剛大道看筆直海景，走玉長公路切回縱谷", "route": "長濱 -> 玉長公路 -> 玉里", "driveTime": "約 35 分鐘", "stayTime": "1~1.5小時", "cost": "$80 ~ $100", "remark": "金剛大道早晨遊客少、拍照極美"},
      {"day": "Day 3", "date": "9/27 (日)", "time": "10:30-12:00", "title": "玉里市區漫步，享用在地名店「玉里麵」午餐", "route": "玉里市區", "driveTime": "-", "stayTime": "1.5小時", "cost": "$150 ~ $250", "remark": "先在市區吃飽後再開車上山"},
      {"day": "Day 3", "date": "9/27 (日)", "time": "12:30-16:00", "title": "直上赤科山賞金針花海、汪家古厝與赤科三景", "route": "玉里 -> 赤科山", "driveTime": "約 40 分鐘(山路)", "stayTime": "3~3.5小時", "cost": "$100 ~ $200", "remark": "出發前確認最新花況與交管"},
      {"day": "Day 3", "date": "9/27 (日)", "time": "16:30-17:30", "title": "下山返回玉里市區，入住玉里質感民宿 (Night 3)", "route": "赤科山 -> 玉里市區", "driveTime": "約 40 分鐘(下山)", "stayTime": "-", "cost": "$1,100 ~ $1,650/人", "remark": "晚餐品嚐玉里橋頭臭豆腐或縱谷美食"},
      {"day": "Day 4", "date": "9/28 (一)", "time": "08:30-09:15", "title": "民宿早餐退房，沿台 9 線一路北上光復", "route": "玉里 -> 大農大富", "driveTime": "約 35 分鐘", "stayTime": "-", "cost": "$80 ~ $100", "remark": "一早出發避開午後艷陽"},
      {"day": "Day 4", "date": "9/28 (一)", "time": "09:30-11:30", "title": "大農大富平地森林園區（租四人電動車遊綠廊）", "route": "園區內慢活騎行", "driveTime": "-", "stayTime": "2小時", "cost": "$150 ~ $200/人", "remark": "連假正常開放，綠色隧道芬多精"},
      {"day": "Day 4", "date": "9/28 (一)", "time": "11:45-13:00", "title": "光復糖廠吃冰、看日式宿舍群 ＋ 享用特色午餐", "route": "大農大富 -> 光復糖廠", "driveTime": "約 10 分鐘", "stayTime": "1~1.5小時", "cost": "$200 ~ $300", "remark": "平路好走無負擔，長輩超愛"},
      {"day": "Day 4", "date": "9/28 (一)", "time": "13:15-14:30", "title": "沿台 9 線北上至花蓮市區，採買名產伴手禮", "route": "光復 -> 花蓮市區", "driveTime": "約 50 分鐘", "stayTime": "1~1.5小時", "cost": "$300 ~ $500", "remark": "買麻糬、奶油酥條、在地點心"},
      {"day": "Day 4", "date": "9/28 (一)", "time": "15:00", "title": "花蓮車站前加滿油、還車（甲租乙還）", "route": "花蓮市區 -> 花蓮車站", "driveTime": "約 10 分鐘", "stayTime": "-", "cost": "$2,875 ~ $3,700/人", "remark": "預留 30 分鐘還車與行李整理緩衝"},
      {"day": "Day 4", "date": "9/28 (一)", "time": "16:00 以後", "title": "搭乘 EMU3000 新自強號直達台北（約 2.5 小時）", "route": "花蓮車站 -> 台北車站", "driveTime": "-", "stayTime": "約 2.5 小時", "cost": "$440 ~ $583", "remark": "推薦自強477/自強281/自強1/自強431車次"}
    ];

    let allTripData = DEFAULT_DATA;
    let currentFilter = 'ALL';

    function renderItinerary() {
      const contentEl = document.getElementById('content-container');
      
      const filtered = (currentFilter === 'ALL') 
        ? allTripData 
        : allTripData.filter(item => (item.day && item.day.includes(currentFilter)) || (item.date && item.date.includes(currentFilter)));

      if (filtered.length === 0) {
        contentEl.innerHTML = `<div style="text-align:center; padding:40px; color:#64748b;">此分類目前無行程。</div>`;
        return;
      }

      // 依天數分組
      const groups = {};
      filtered.forEach(item => {
        const key = `${item.day || '行程'}__${item.date || ''}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });

      let html = "";
      for (const groupKey in groups) {
        const [dayName, dateName] = groupKey.split('__');
        html += `
          <div class="day-section">
            <div class="day-header">
              <span class="day-badge">${dayName}</span>
              ${dateName ? `<span class="day-date">${dateName}</span>` : ''}
            </div>
        `;

        groups[groupKey].forEach(item => {
          const mapQuery = encodeURIComponent(item.title.replace(/\(.*?\)/g, ''));
          const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

          html += `
            <div class="item-card">
              <div class="item-top">
                <span class="item-time">⏰ ${item.time || '行程'}</span>
              </div>
              <div class="item-title">${item.title}</div>
              
              <div class="tags">
                ${item.driveTime && item.driveTime !== '-' ? `<span class="tag">🚗 車程: ${item.driveTime}</span>` : ''}
                ${item.stayTime && item.stayTime !== '-' ? `<span class="tag">⏳ 建議停留: ${item.stayTime}</span>` : ''}
                ${item.cost && item.cost !== '-' && item.cost !== '0' ? `<span class="tag cost">💰 ${item.cost}</span>` : ''}
              </div>

              ${(item.route || item.remark) ? `
                <div class="item-detail">
                  ${item.route && item.route !== '-' ? `<div class="item-detail-row">📍 <strong>動線：</strong>${item.route}</div>` : ''}
                  ${item.remark && item.remark !== '-' ? `<div class="item-detail-row">💡 <strong>備註：</strong>${item.remark}</div>` : ''}
                </div>
              ` : ''}

              <a href="${mapUrl}" target="_blank" class="nav-btn">📍 Google 地圖導航</a>
            </div>
          `;
        });

        html += `</div>`;
      }

      contentEl.innerHTML = html;
    }

    function filterDay(day) {
      currentFilter = day;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(day) || (day === 'ALL' && btn.innerText === '全部行程'));
      });
      renderItinerary();
    }

    function fetchLiveData() {
      const statusEl = document.getElementById('sync-status');
      statusEl.innerText = "⏳ 正在同步 Google 試算表...";

      Papa.parse(CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 1) {
            const rows = results.data;
            // 尋找標題列所在的 index
            let headerIdx = rows.findIndex(r => r.some(cell => typeof cell === 'string' && (cell.includes('天數') || cell.includes('行程'))));
            if (headerIdx === -1) headerIdx = 0;

            const dataRows = rows.slice(headerIdx + 1).filter(r => r[0] && r[0].trim() !== "" && !r[0].includes("順序"));

            if (dataRows.length > 0) {
              allTripData = dataRows.map(r => ({
                day: r[0] ? r[0].trim() : "",
                date: r[1] ? r[1].trim() : "",
                time: r[2] ? r[2].trim() : "",
                title: r[3] ? r[3].trim() : "",
                route: r[4] ? r[4].trim() : "",
                driveTime: r[5] ? r[5].trim() : "",
                stayTime: r[6] ? r[6].trim() : "",
                cost: r[7] ? r[7].trim() : "",
                remark: r[8] ? r[8].trim() : ""
              }));

              renderItinerary();
              const now = new Date();
              const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
              statusEl.innerText = `✅ 已同步最新 Google 試算表（${timeStr}）`;
              return;
            }
          }
          statusEl.innerText = `✅ 已載入預設行程資料`;
        },
        error: function(err) {
          console.warn("無法取得線上試算表，使用預設行程資料", err);
          statusEl.innerText = `✅ 已載入預設行程（點即時同步可重試）`;
        }
      });
    }

    // 1. 頁面開啟時 0 秒立即顯示預設行程，長輩打開秒看
    renderItinerary();
    // 2. 背景自動連線 Google 試算表拉取最新變更
    fetchLiveData();
  </script>
</body>
</html>
